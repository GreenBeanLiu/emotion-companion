<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pulomi</title>
    <!-- Noto Sans SC for reliable CJK rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Browser preview mock: inject window.api when not running in Electron -->
    <script>
      if (!window.api) {
        window.api = {
          win: { minimize: () => {}, maximize: () => {}, close: () => {} },
          settings: {
            load: () => Promise.resolve({ provider: 'openai', apiKey: '', model: 'gpt-4o', baseUrl: '', characterId: 'default', systemPrompt: '', customSystemPrompt: '', tikhubKey: '' }),
            save: () => Promise.resolve({ ok: true })
          },
          conv: {
            list: () => Promise.resolve([
              { id: 1, title: '今天心情有点低落', created_at: new Date().toISOString(), updated_at: new Date().toISOString(), message_count: 5 },
              { id: 2, title: '最近压力好大，想聊聊', created_at: new Date().toISOString(), updated_at: new Date().toISOString(), message_count: 12 },
              { id: 3, title: '分享一件开心的事', created_at: new Date().toISOString(), updated_at: new Date().toISOString(), message_count: 3 }
            ]),
            create: (t) => Promise.resolve({ id: Date.now(), title: t || '新对话', created_at: new Date().toISOString(), updated_at: new Date().toISOString() }),
            rename: () => Promise.resolve({ ok: true }),
            delete: () => Promise.resolve({ ok: true })
          },
          msg: { list: () => Promise.resolve([]) },
          memory: { get: () => Promise.resolve(null), clear: () => Promise.resolve({ ok: true }) },
          stats: {
            emotions: () => {
              // generate ~60 days of mock emotion data
              const emotions = ['开心','平静','焦虑','悲伤','愤怒','疲惫','孤独'];
              const result = [];
              const today = new Date();
              for (let i = 59; i >= 0; i--) {
                const d = new Date(today); d.setDate(today.getDate() - i);
                if (Math.random() > 0.35) { // ~65% days have entries
                  const date = d.toISOString().slice(0,10);
                  const n = Math.floor(Math.random() * 3) + 1;
                  for (let j = 0; j < n; j++) {
                    result.push({ date, emotion: emotions[Math.floor(Math.random()*emotions.length)], count: Math.floor(Math.random()*3)+1 });
                  }
                }
              }
              return Promise.resolve(result);
            }
          },
          chat: {
            send: () => Promise.resolve({ error: 'mock' }),
            abort: () => Promise.resolve({ ok: true }),
            onChunk: () => () => {},
            onDone: () => () => {},
            onEmotionUpdate: () => () => {},
            onBilibiliResults: () => () => {}
          },
          update: { onAvailable: () => () => {}, onDownloaded: () => () => {}, install: () => {} }
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
